<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Slide Compiler — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">🖥</span>
                <div class="title-col">
                    <h1>Markdown Slide Compiler</h1>
                    <p class="tagline">Translates markdown notes into structured slide presentations.</p>
                </div>
            </div>
            <div class="badge">media</div>
        </header>

        <main class="workspace-card">
            
            <div id="slide-box" style="height:150px; background:#0c0c14; border-radius:8px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; padding:20px; font-size:18px; text-align:center;">Slide 1: Welcome!</div>
            <div style="display:flex; gap:12px; justify-content:center; margin-top:12px;">
                <button class="btn" onclick="nextSlide(-1)">Prev</button>
                <button class="btn" onclick="nextSlide(1)">Next</button>
            </div>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
